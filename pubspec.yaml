name: ecopin_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  dio: ^5.9.2
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_map: 8.2.2
  flutter_polyline_points: ^3.1.0
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  latlong2: ^0.9.1
  geolocator: ^14.0.3
  supabase_flutter: ^2.15.0
  url_launcher: ^6.3.2
  geobase: ^1.5.0
  camera: ^0.12.0+1
  image_picker: ^1.2.2
  permission_handler: ^12.0.3
  flutter_local_notifications: ^22.0.0
  badges: ^3.2.0
  flutter_slidable: ^4.0.3
  cached_network_image: ^3.4.1
  flutter_map_location_marker: ^10.2.0
  flutter_map_heatmap:
    git:
      url: https://github.com/klacom/fluttermap_heatmap.git
  connectivity_plus: ^6.1.3
  app_links: ^6.3.2
  logging: ^1.3.0
  intl: ^0.20.3
  shared_preferences: ^2.5.2
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  flutter_rotation_sensor:
    path: packages/flutter_rotation_sensor

flutter:
  uses-material-design: true
  assets:
    - .env

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Thin.ttf
          weight: 100
        - asset: assets/fonts/Outfit-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Outfit-Light.ttf
          weight: 300
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Outfit-Black.ttf
          weight: 900
